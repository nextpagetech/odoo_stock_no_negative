<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#ffffff"/>
<rect width="1200" height="92" fill="#0B326B"/>
<text x="55" y="58" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="#ffffff">Flexible Negative Stock Exceptions</text>
<text x="55" y="137" font-family="Arial,sans-serif" font-size="21" fill="#5B6B7A">Negative stock is blocked by default, with controlled exceptions at three configuration levels.</text>
<g transform="translate(55 205)">
 <rect width="340" height="345" rx="24" fill="#F5FAFF" stroke="#C9DDEC" stroke-width="3"/>
 <text x="30" y="55" font-family="Arial" font-size="27" font-weight="700" fill="#0B326B">Product</text>
 <line x1="30" y1="80" x2="310" y2="80" stroke="#D5E5F2" stroke-width="2"/>
 <text x="30" y="130" font-family="Arial" font-size="19" font-weight="700" fill="#5B6B7A">Allow Negative Stock</text>
 <rect x="245" y="105" width="65" height="38" rx="14" fill="#0875D1"/><text x="268" y="132" font-family="Arial" font-size="22" font-weight="700" fill="#fff">✓</text>
 <text x="30" y="190" font-family="Arial" font-size="18" fill="#5B6B7A">Enable an exception only for a</text>
 <text x="30" y="220" font-family="Arial" font-size="18" fill="#5B6B7A">specific stockable product.</text>
</g>
<g transform="translate(430 205)">
 <rect width="340" height="345" rx="24" fill="#F5FAFF" stroke="#C9DDEC" stroke-width="3"/>
 <text x="30" y="55" font-family="Arial" font-size="27" font-weight="700" fill="#0B326B">Product Category</text>
 <line x1="30" y1="80" x2="310" y2="80" stroke="#D5E5F2" stroke-width="2"/>
 <text x="30" y="130" font-family="Arial" font-size="19" font-weight="700" fill="#5B6B7A">Allow Negative Stock</text>
 <rect x="245" y="105" width="65" height="38" rx="14" fill="#0875D1"/><text x="268" y="132" font-family="Arial" font-size="22" font-weight="700" fill="#fff">✓</text>
 <text x="30" y="190" font-family="Arial" font-size="18" fill="#5B6B7A">Allow the exception for stockable</text>
 <text x="30" y="220" font-family="Arial" font-size="18" fill="#5B6B7A">products assigned to this category.</text>
</g>
<g transform="translate(805 205)">
 <rect width="340" height="345" rx="24" fill="#F5FAFF" stroke="#C9DDEC" stroke-width="3"/>
 <text x="30" y="55" font-family="Arial" font-size="27" font-weight="700" fill="#0B326B">Stock Location</text>
 <line x1="30" y1="80" x2="310" y2="80" stroke="#D5E5F2" stroke-width="2"/>
 <text x="30" y="130" font-family="Arial" font-size="19" font-weight="700" fill="#5B6B7A">Allow Negative Stock</text>
 <rect x="245" y="105" width="65" height="38" rx="14" fill="#0875D1"/><text x="268" y="132" font-family="Arial" font-size="22" font-weight="700" fill="#fff">✓</text>
 <text x="30" y="190" font-family="Arial" font-size="18" fill="#5B6B7A">Permit negative quantities for a</text>
 <text x="30" y="220" font-family="Arial" font-size="18" fill="#5B6B7A">selected internal or transit location.</text>
</g>
<text x="55" y="620" font-family="Arial" font-size="20" font-weight="700" fill="#0B326B">Scope:</text>
<text x="125" y="620" font-family="Arial" font-size="19" fill="#5B6B7A">Stockable products in internal/transit locations. Consumable products are not blocked by this rule.</text>
</svg>